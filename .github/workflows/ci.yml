# Runs the two commands AGENTS.md documents, plus the one it could not: the
# SpacetimeDB module is excluded from the Cargo workspace (see the root
# `Cargo.toml` for why), so `cargo test --workspace` never touched 13k lines of
# authoritative server logic. It gets its own job here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned, not `stable`. `-D warnings` turns every new clippy lint into a
  # build failure, so a floating toolchain means an unrelated Rust release can
  # break CI on code nobody touched — which happened on the first run of this
  # workflow: `stable` was 1.98 while the project develops on 1.96, and
  # `chunks_exact_to_as_chunks` (new in 1.98) failed the module job.
  #
  # This is the version the project is developed against. Bumping it is a
  # deliberate commit that fixes whatever new lints come with it. To pin local
  # toolchains to the same version as well, add a `rust-toolchain.toml`.
  RUST_VERSION: "1.96.1"

jobs:
  workspace:
    name: Workspace — lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      # `crates/presentation` and `crates/client` enable bevy's `default`
      # features, so `bevy_winit` and `bevy_audio` are in the build and their
      # `-sys` crates need real headers — even though CI never opens a window.
      # The first run of this workflow failed on `wayland-sys` for exactly this
      # reason: ALSA and udev alone are not enough.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # The module builds for a different target and has its own lockfile
          # resolution; sharing one cache key between the two jobs would thrash.
          key: workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  module:
    name: SpacetimeDB module — lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/stdb-module
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/stdb-module
          key: module

      # Host-target lint and test. Neither links, which is what makes them
      # possible at all: `spacetimedb-bindings-sys` declares its host functions
      # as WASM imports with no `#[cfg(target_arch)]` guard, so a host *build*
      # would fail on unresolved symbols.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The one step that proves the module still links for the target it
      # actually runs on. `spacetime build` wraps `cargo build --target
      # wasm32-unknown-unknown --release` plus the schema extraction that
      # catches, for example, a table row type the SATS derive cannot handle.
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build module
        run: spacetime build
