# Development environment: SpacetimeDB runs locally via
# `docker compose up -d spacetimedb`, and `default.toml` already points at it.
#
# This file is deliberately almost empty. It previously carried a
# `database_url` for PostgreSQL plus `[server]` and `[client]` sections from
# the lightyear-era networking — none of which `Settings` has a field for, so
# serde had been silently discarding all of it. SpacetimeDB tables *are* the
# database now (see AGENTS.md).
#
# Put local overrides in `config/local.toml`, which is gitignored.
