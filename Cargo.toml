[workspace]
members = [
    "crates/core",
    "crates/world",
    "crates/gameplay",
    "crates/content",
    "crates/app-support",
    "crates/network",
    "crates/domain",

    "crates/bevymmo-props-macro",
    "crates/client",
    "crates/presentation",
    "apps/gateway",
    "bins/game",
]
default-members = ["bins/game"]
# The SpacetimeDB module is its own build: `wasm32-unknown-unknown`, `cdylib`,
# and the only crate allowed to depend on `spacetimedb`. Keeping it out of the
# workspace stops a stray `cargo build` from trying to link its WASM imports
# into a native binary. Build it with `spacetime build`/`publish` instead.
# `crates/server` was the outgoing Bevy/lightyear/Postgres server, kept on disk
# as a reference while its gameplay was ported into `crates/stdb-module`. The
# port is done and the directory is gone; the exclude entry stays harmless but
# is listed here only so the next person does not go looking for it.
exclude = ["crates/stdb-module"]
resolver = "2"

# Shared package metadata. Every member inherits these with
# `version.workspace = true` etc., so a version or licence change is one edit.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alessandrobrunoh/BevyMMO"

[workspace.lints.clippy]
# Bevy query types are structurally verbose by design:
# `Query<(Entity, &A, &mut B), (With<C>, Without<D>)>` is the idiomatic spelling,
# and hiding it behind a `type` alias costs more readability than it buys. This
# fired 23 times across the workspace, i.e. it is noise here, not signal.
# `too_many_arguments` is *not* disabled — see `clippy.toml`, which raises its
# threshold instead so genuinely overgrown systems still warn.
type_complexity = "allow"

# Dev-profile tuning, aimed squarely at the size of `target/`.
#
# A stock debug build of this workspace produced a 45 GB `target/`, 38 GB of it
# in `deps/`, which is enough to fill a disk mid-link (`ld: write() failed,
# errno=28`). Almost all of that is DWARF for third-party crates nobody steps
# through.
[profile.dev]
# Keeps file/line in panics and backtraces — what you actually read day to day —
# without emitting full variable-inspection DWARF for every crate.
debug = "line-tables-only"
# `target/debug/incremental` alone reached 6.9 GB. The workspace crates are
# small enough that a full crate rebuild costs a few seconds, and linking
# dominates the edit-run loop anyway, so the cache does not pay for its size
# here.
incremental = false

# Dependencies are never stepped through: no debug info at all for them. This
# is where the bulk of the 38 GB came from.
[profile.dev.package."*"]
debug = false

# The release profile exists for one artifact: the dedicated server, which runs
# for days and is built once by CI. Trading build time for runtime throughput is
# the right way round there.
[profile.release]
# Thin LTO gets most of the cross-crate inlining of fat LTO at a fraction of the
# link time — worth it for a hot ECS loop spread across six workspace crates.
lto = "thin"
codegen-units = 1

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_color", "bevy_log"] }
lightyear = { version = "0.28", features = [
    "interpolation",
    "prediction",
    "replication",
    "input_native",
    "netcode",
    "udp",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5"
clap = { version = "4.5", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
